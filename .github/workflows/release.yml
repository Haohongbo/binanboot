name: Build release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main process
        run: npm run build

      - name: Package and upload release assets
        run: npx electron-builder ${{ matrix.target }} --publish always

  build-linux-centos8:
    name: Build Linux CentOS 8 x64
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux'
    runs-on: ubuntu-22.04
    container:
      image: rockylinux:8
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Install system packages
        run: |
          dnf install -y git rpm-build tar gzip xz unzip which python3 make gcc gcc-c++
          dnf clean all

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and main process
        run: npm run build

      - name: Package and upload release assets
        run: npx electron-builder --linux AppImage rpm --x64 --publish always

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binanboot-centos8-linux-x64
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error
